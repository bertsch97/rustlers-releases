      if (score > 0 && (!best || score > best.score)) best = { ref: p.ref, score: score };
    }

    if (!best || best.score < 0.55) return null;
    return best;
  }

  /*
   * bestPhraseMatch(text, entries)
   * entries: [{ ...anything, phrases: ['multi word phrase', 'word'] }]
   * Longest matched phrase wins (so "touchdown pass" beats plain
   * "touchdown" when both are present). Returns
   * { entry, phrase, specificity(word count) } or null.
   *
   * Multi-word phrases: exact word-boundary substring match.
   * Single-word phrases: PREFIX match against each word in the text —
   * "kill" matches "kills", "tackle" matches "tackled", "sack" matches
   * "sacked" — without listing every inflection by hand. This must be a
   * prefix match, not a raw substring match: a real broadcast transcript
   * caught a raw-substring version of this matching a bare "complete"
   * phrase against "incomplete" (which CONTAINS "complete" but does not
   * START WITH it) — prefix matching correctly rejects that while still
   * catching ordinary suffixes like -s/-ed/-ing. It doesn't catch
   * irregular forms ("dig" vs "dug") — those need their own phrase.
   *
   * If no prefix match, single-word phrases fall back to a bounded
   * edit-distance fuzzy check — real on-device audio produced "ace"
   * transcribed as "race" and "solo" as "sole" purely from enunciation/
   * mic noise, not a vocabulary gap, and there's no way to list every
   * such mishearing in advance. editDistanceAllowed() below scales the
   * tolerance with word length (0 for words under 4 letters — too easy
   * to collide with an unrelated short word by chance) and any phrase
   * entry can opt out entirely with `noFuzzy:true`. That opt-out matters:
   * "kill" is one edit from "will" and "sack" is one edit from "back" —
   * both extremely common words in ordinary commentary near a player's
   * name ("Sutton will serve", "runs it back") — so fuzzy tolerance on
   * those two specifically would flood false positives rather than
   * catch real mishearings. Both are marked noFuzzy in their keyword
   * files; rely on listing the actual observed variant instead (as
   * already done elsewhere) for short/collision-prone words like those.
   */
  function editDistanceAllowed(len) {
    if (len < 4) return 0;
    if (len < 8) return 1;
    return 2;
  }

    var norm = ' ' + normalize(text) + ' ';
    var words = normalize(text).split(' ');

          ? words.some(function (w) { return w.indexOf(p) === 0; })
          : norm.indexOf(' ' + p + ' ') !== -1;
        if (!matched && isSingleWord && !entry.noFuzzy) {
          var allowed = editDistanceAllowed(p.length);
          if (allowed > 0) {
            matched = words.some(function (w) { return w.length >= 3 && levenshtein(p, w) <= allowed; });
          }
        }
        if (matched) {
          var specificity = p.split(' ').length;
          if (!best || specificity > best.specificity) {
            best = { entry: entry, phrase: phrases[j], specificity: specificity };
          }
        }
      }
    }
    return best;
  }

  NS.normalize = normalize;
  NS.levenshtein = levenshtein;
  NS.similarity = similarity;
  NS.explicitJerseyNumbers = explicitJerseyNumbers;
  NS.matchPlayerInText = matchPlayerInText;
  NS.bestPhraseMatch = bestPhraseMatch;

})();

/*
 * Volleyball parser: pure local pattern/keyword matching, no LLM, no
 * network. Given a transcript chunk and the roster candidates currently
 * on the floor, returns a structured guess or null.
 *
 * Requires fuzzyMatch.js and keywords/volleyball.js to be loaded first
 * (both attach to the shared RustlersVoice namespace).
 *
 * A player mention is NOT required to surface a suggestion — when the
 * event itself is confident but no player matched, the result carries
 * needsPlayer:true and playerRef:null instead of being dropped; the UI
 * then asks which player to credit. See parsers/basketball.js for the
 * fuller rationale (dictation-style calling often omits the name).
 */

  var root = typeof window !== 'undefined' ? window : global;
  var NS = (root.RustlersVoice = root.RustlersVoice || {});
  var FM = NS; // fuzzyMatch helpers live on the same namespace
  NS.parsers = NS.parsers || {};

  // ctx.roster: [{ ref, num, name }] — home + away candidates already
  // merged by the caller (engine.js), each ref carrying which side it
  // came from.

    var events = NS.keywords && NS.keywords.volleyball;
    if (!events || !transcript || !ctx) return null;

    var evMatch = FM.bestPhraseMatch(transcript, events);
    if (!evMatch) return null;

    var playerMatch = FM.matchPlayerInText(transcript, ctx.roster);
    var eventConfidence = Math.min(1, 0.55 + 0.15 * evMatch.specificity);

    if (!playerMatch) {
      return {
        actKey: evMatch.entry.key,
        eventLabel: evMatch.entry.label,
        mode: 'player-action',
        playerRef: null,
        needsPlayer: true,
        confidence: eventConfidence
      };
    }

    // Confidence blends event-phrase specificity (more words = more sure)
    // with player-name match strength. Both signals must be present.
    var confidence = Math.min(eventConfidence, playerMatch.score) * 0.9
      + Math.min(eventConfidence, playerMatch.score) * 0.1;

    return {
      actKey: evMatch.entry.key,
      eventLabel: evMatch.entry.label,
      mode: 'player-action',
      playerRef: playerMatch.ref,
      confidence: confidence
    };
  }

  NS.parsers.volleyball = { parse: parse };
  if (typeof module !== 'undefined' && module.exports) module.exports = { parse: parse };
})();

/*
 * Football parser: pure local keyword matching. Same shape as the
 * volleyball parser but pulls from keywords/football.js. Interception

 * transcript contains that pattern, drop the suggestion rather than

/*
 * Basketball parser: pure local keyword matching. Basketball splits into
 * two output modes: 'score' (per-player make/miss) and 'teamstat'
 * (team-level counters, routes through teamStatTap — no specific player
 * is credited by the app's own data model).
 *
 * IMPORTANT — makes and misses are NOT symmetric in the app's own data
 * model, and getting this wrong produces a real, wrong stat: cfg.basketball
 * .scoreButtons only has SIX entries (+1/+2/+3 for makes, and −1/−2/−3),
 * but the negative ones are NOT misses — they're CORRECTIONS that undo a
 * previously-recorded make (commitScore decrements the make counter AND
 * subtracts the points). A genuine miss goes through a completely
 * separate array, cfg.basketball.missButtons ("2PT Miss"/"3PT Miss"/
 * "FT Miss"), calling a different method, commitMiss() — which only
 * increments a miss counter and never touches score. Routing a miss
 * through the negative scoreButtons entries (an earlier version of this
 * parser did exactly that) silently records it as an UNDO of a make
 * that was never recorded, decrementing both the make count and the
 * score — confirmed as a real bug from on-device testing. Makes use
 * `scoreIdx` into scoreButtons; misses use `missIdx` into missButtons;

 * build-patch.js's onVoiceConfirm/onVoiceConfirmWithPlayer for how the
 * two are routed to commitScore vs. commitMiss respectively.

 * an explicit outcome phrase (miss checked before make — see

 * confirmed outcome is dropped rather than assumed to be a make.

 * live dictation-style calling ("off the mark with the jumper") often
 * doesn't name the shooter, unlike broadcast commentary. When the event
 * is confident but no player matched, the result carries
 * `needsPlayer:true` and `playerRef:null` instead of being dropped; the
 * UI then asks which player to credit rather than guessing (see
 * engine.toBridgePayload / ui.js / build-patch.js's onVoiceConfirmWithPlayer).
 * The event itself must still be unambiguous — a shot type with no
 * confirmed outcome is still dropped, not turned into a "which player,
 * which result?" question.
 *

 * side when present, but real commentary often names the TEAM instead
 * ("the Chieftains turn it over") — ctx.engine's matchTeamSide() is the
 * fallback for that case; if neither a player nor a team name can be

 * UI — the app's own teamStatTap is scoped to a side, not a player).

  var NS = (root.RustlersVoice = root.RustlersVoice || {});
  var FM = NS;

  // Makes -> index into cfg.basketball.scoreButtons ([+1 FT, +2 2PT, +3 3PT, ...corrections]).
  // Misses -> index into cfg.basketball.missButtons ([2PT Miss, 3PT Miss, FT Miss]).
  function scoreButtonIdxForMake(stat) {
    if (stat === 1) return 0;
    if (stat === 2) return 1;
    return 2; // stat === 3
  }
  function missButtonIdxForMiss(stat) {
    if (stat === 2) return 0;
    if (stat === 3) return 1;
    return 2; // stat === 1 (FT)
  }

  function parse(transcript, ctx) {
    var kw = NS.keywords;
    if (!kw || !transcript || !ctx) return null;

    var playerMatch = FM.matchPlayerInText(transcript, ctx.roster);

    // ---- scoring: shot type + explicit outcome, both required (player optional) --
    var shotMatch = kw.basketballShotType && FM.bestPhraseMatch(transcript, kw.basketballShotType);
    if (shotMatch) {
      var missMatch = kw.basketballMiss && FM.bestPhraseMatch(transcript, kw.basketballMiss);

        var isMake = !missMatch;
        var scoreIdx = isMake ? scoreButtonIdxForMake(shotMatch.entry.stat) : null;
        var missIdx = isMake ? null : missButtonIdxForMiss(shotMatch.entry.stat);
        var shotConfidence = Math.min(1, 0.5 + 0.15 * shotMatch.specificity);
        var outcomeConfidence = Math.min(1, 0.5 + 0.15 * outcomeMatch.specificity);

        if (playerMatch) {
          return {
            mode: 'score',
            scoreIdx: scoreIdx,
            missIdx: missIdx,
            eventLabel: eventLabel,
            playerRef: playerMatch.ref,
            confidence: Math.min(shotConfidence, outcomeConfidence, playerMatch.score)
          };
        }
        return {
          mode: 'score',
          scoreIdx: scoreIdx,
          missIdx: missIdx,
          eventLabel: eventLabel,
          playerRef: null,
          needsPlayer: true,
          confidence: Math.min(shotConfidence, outcomeConfidence)
        };
      }
      // Shot type mentioned but no confirmed outcome — ambiguous, fall
      // through to team-stat matching rather than guessing a result.
    }

    // ---- team-level stats: player OR team-name attribution -----------
    var statMatch = kw.basketballTeamStat && FM.bestPhraseMatch(transcript, kw.basketballTeamStat);
    if (statMatch) {
      var side = playerMatch ? playerMatch.ref.side : (NS.engine ? NS.engine.matchTeamSide(ctx, transcript) : null);
      if (!side) return null;
      var statConfidence = Math.min(1, 0.55 + 0.15 * statMatch.specificity);
      var sideConfidence = playerMatch ? playerMatch.score : 0.75; // an explicit team-name mention is fairly unambiguous
      return {
        mode: 'teamstat',
        statKey: statMatch.entry.statKey,
        eventLabel: statMatch.entry.label,
        foul: !!statMatch.entry.foul,
        playerRef: { side: side, id: playerMatch ? playerMatch.ref.id : null },
        confidence: Math.min(statConfidence, sideConfidence)
      };
    }

    return null;
  }

  NS.parsers.basketball = { parse: parse };
  if (typeof module !== 'undefined' && module.exports) module.exports = { parse: parse };
})();

/*
 * engine.js
 * ------------------------------------------------------------------
 * Orchestrates: live app state (read-only, from the same localStorage
 * blob the app itself persists to) -> roster candidates -> per-sport
 * parser -> confidence gate -> a suggestion object the UI layer can
 * render and, on Confirm, hand to the bridge (voice-suggestions/ui.js)
 * for the app's own doAction/commitScore/teamStatTap methods to apply.
 *
 * Pure logic only — no DOM, no Capacitor. Reads state the caller passes
 * in; never touches localStorage itself (ui.js owns that read).
 */
(function () {
  var root = typeof window !== 'undefined' ? window : global;
  var NS = (root.RustlersVoice = root.RustlersVoice || {});
  NS.engine = NS.engine || {};

  // Below this, a parse is dropped silently rather than surfaced —
  // false positives are worse than false negatives for this feature.
  var CONFIDENCE_THRESHOLD = 0.62;

  var SUPPORTED_SPORTS = { basketball: 1, basketballB: 1, football: 1, volleyball: 1 };

  // state: the full app state object (JSON.parse of localStorage['rustlers_v2']).
  // Returns null if there's no live, in-progress game on a supported sport.
  function buildContext(state) {
    if (!state || !state.sport || !SUPPORTED_SPORTS[state.sport]) return null;
    var sport = state.sport;
    var baseSport = sport === 'basketballB' ? 'basketball' : sport;
    var sea = state.seasons && state.seasons[sport];
    if (!sea || !sea.activeId) return null;
    var g = (sea.games || []).find(function (x) { return x.id === sea.activeId; });
    if (!g || g.status === 'final') return null;

    var roster = [];
    (sea.roster || []).forEach(function (p) {
      roster.push({ ref: { side: 'home', id: p.id }, num: p.num, name: p.name });
    });
    (g.vroster || []).forEach(function (num) {
      var m = (g.vmeta || {})[num] || {};
      roster.push({ ref: { side: 'away', id: num }, num: num, name: m.name || '' });
    });

    return { sport: sport, baseSport: baseSport, roster: roster, gameId: g.id, opp: g.opp || 'Visitor' };
  }

  // Real broadcast audio often names the TEAM, not a player, for team-level
  // events ("the Chieftains turn it over"). This app is single-tenant (always
  // "Miller Rustlers" for the home side — see cfg[sport].label/teamNameFor in
  // the app template, not a per-instance setting), so "rustlers" is a safe
  // hardcoded home-side signal; the away side comes from the live game's own
  // g.opp (e.g. "Crow Creek Chieftains" -> nickname "Chieftains").
  var HOME_NICK = 'rustlers';
  function matchTeamSide(ctx, text) {
    var norm = ' ' + NS.normalize(text) + ' ';
    var opp = NS.normalize(ctx.opp || '');
    var oppNick = opp.split(' ').filter(Boolean).pop() || opp;
    if (oppNick && norm.indexOf(' ' + oppNick + ' ') !== -1) return 'away';
    if (opp && norm.indexOf(' ' + opp + ' ') !== -1) return 'away';
    if (norm.indexOf(' ' + HOME_NICK + ' ') !== -1) return 'home';
    return null;
  }

  // ctx: result of buildContext(). Returns a suggestion object or null
  // (either nothing matched, or it matched below the confidence floor).
  function parseTranscript(ctx, transcript) {
    if (!ctx || !transcript) return null;
    var parser = NS.parsers && NS.parsers[ctx.baseSport];
    if (!parser) return null;
    var result = parser.parse(transcript, ctx);
    if (!result || !(result.confidence >= CONFIDENCE_THRESHOLD)) return null;
    return result;
  }

  function playerLabel(ctx, ref) {
    if (!ref) return '';
    var entry = ctx.roster.filter(function (r) {
      return r.ref.side === ref.side && String(r.ref.id) === String(ref.id);
    })[0];
    if (!entry) return '';
    var last = (entry.name || '').split(' ').filter(Boolean).pop() || entry.name || '';
    return '#' + entry.num + ' ' + last;
  }

  // Every roster candidate (home + away), formatted for a tappable
  // player-picker list — used when a suggestion's playerRef is null
  // (needsPlayer:true) and the UI needs to ask which player to credit.
  function rosterCandidates(ctx) {
    return ctx.roster.map(function (r) {
      var last = (r.name || '').split(' ').filter(Boolean).pop() || r.name || '';
      return { side: r.ref.side, id: r.ref.id, label: '#' + r.num + ' ' + last };
    });
  }

  // Shape consumed by the injected bridge handler in the app template
  // (see build-patch.js -> voiceIngestFromBridge()/onVoiceConfirm()).
  // playerRef may be null (needsPlayer:true) — team/pid stay null until
  // the UI's player picker fills them in via onVoiceConfirmWithPlayer.
  function toBridgePayload(result) {
    return {
      team: result.playerRef ? result.playerRef.side : null,
      pid: result.playerRef ? result.playerRef.id : null,
      mode: result.mode,
      actKey: result.actKey || null,
      scoreIdx: (result.scoreIdx == null ? null : result.scoreIdx),
      missIdx: (result.missIdx == null ? null : result.missIdx),
      statKey: result.statKey || null,
      statLabel: result.eventLabel || '',
      foul: !!result.foul,
      needsPlayer: !!result.needsPlayer,
      sign: 1
    };
  }

  NS.engine.buildContext = buildContext;
  NS.engine.matchTeamSide = matchTeamSide;
  NS.engine.parseTranscript = parseTranscript;
  NS.engine.playerLabel = playerLabel;
  NS.engine.rosterCandidates = rosterCandidates;
  NS.engine.toBridgePayload = toBridgePayload;
  NS.engine.CONFIDENCE_THRESHOLD = CONFIDENCE_THRESHOLD;

  if (typeof module !== 'undefined' && module.exports) module.exports = NS.engine;
})();

/*
 * recognizer.js
 * ------------------------------------------------------------------
 * Thin wrapper around the @capacitor-community/speech-recognition
 * plugin, which itself wraps Android's on-device android.speech.
 * SpeechRecognizer — free, no network call once the on-device language
 * pack is present (Android Settings -> System -> Languages & input ->
 * On-screen keyboard -> Google Voice Typing -> Offline speech recognition
 * -> download the language pack).
 *
 * Android's SpeechRecognizer handles one utterance per start() call, not
 * continuous streaming, so this restarts recognition in a loop after
 * every result/timeout/error — a rolling ~8s window. Every failure mode
 * (plugin missing, permission denied, no offline pack, mid-window error)
 * is swallowed: the loop either backs off and retries or gives up
 * silently for the session. It must never throw into the caller and
 * must never block manual stat entry.
 *
 * No DOM assumptions beyond `window.Capacitor.Plugins.SpeechRecognition`
 * (the standard Capacitor 6 web-bridge plugin registration).
 *
 * Audio input: expected to be a wired lav mic plugged directly into the
 * Android tablet, physically separate from the Wirecast audio chain (no
 * shared device, no loopback/splitter). This wrapper never names a
 * specific input device — plugin.start() below takes no device option —
 * so Android routes through whatever input is currently active/default,
 * which picks up a plugged-in wired mic automatically. No device-
 * selection UI is needed for this MVP. A closer, dedicated mic should
 * mean a cleaner signal than a room mic would, but that's a reason to
 * expect somewhat better results, not a reason to relax the confidence
 * threshold in engine.js — low-confidence parses still get dropped.
 */
(function () {
  var root = typeof window !== 'undefined' ? window : global;
  var NS = (root.RustlersVoice = root.RustlersVoice || {});
  NS.recognizer = NS.recognizer || {};

  var WINDOW_MS = 8000; // rolling recognition window
  var RESTART_DELAY_MS = 300; // pause between windows
  var ERROR_BACKOFF_MS = 2000; // pause after a failed window
  var MAX_CONSECUTIVE_ERRORS = 6; // give up for the session past this

  function getPlugin() {
    try {
      return root.Capacitor && root.Capacitor.Plugins && root.Capacitor.Plugins.SpeechRecognition;
    } catch (e) { return null; }
  }

  // create({ onTranscript, onStatus }) -> { start(), stop(), isRunning() }
  function create(opts) {
    opts = opts || {};
    var onTranscript = typeof opts.onTranscript === 'function' ? opts.onTranscript : function () {};
    var onStatus = typeof opts.onStatus === 'function' ? opts.onStatus : function () {};

    var running = false;
    var consecutiveErrors = 0;
    var timeoutHandle = null;

    function reportStatus(s) { try { onStatus(s); } catch (e) {} }

    function runOneWindow() {
      if (!running) return;
      var plugin = getPlugin();
      if (!plugin || !plugin.start) {
        reportStatus('unavailable');
        running = false;
        return;
      }

      var settled = false;
      var forceStopTimer = setTimeout(function () {
        if (settled) return;
        try { plugin.stop && plugin.stop(); } catch (e) {}
      }, WINDOW_MS);

      Promise.resolve()
        .then(function () {
          return plugin.start({
            language: 'en-US',
            maxResults: 1,
            partialResults: false,
            popup: false
          });
        })
        .then(function (res) {
          settled = true;
          clearTimeout(forceStopTimer);
          consecutiveErrors = 0;
          var text = res && res.matches && res.matches[0];
          if (text && running) {
            try { onTranscript(text); } catch (e) {}
          }
        })
        .catch(function () {
          // No speech detected / timeout / busy / denied mid-window —
          // all treated the same: count it, back off, try again.
          settled = true;
          clearTimeout(forceStopTimer);
          consecutiveErrors++;
        })
        .then(function () {
          if (!running) return;
          if (consecutiveErrors >= MAX_CONSECUTIVE_ERRORS) {
            reportStatus('gave-up');
            running = false;
            return;
          }
          var delay = consecutiveErrors > 0 ? ERROR_BACKOFF_MS : RESTART_DELAY_MS;
          timeoutHandle = setTimeout(runOneWindow, delay);
        });
    }

    function start() {
      if (running) return;
      var plugin = getPlugin();
      if (!plugin) { reportStatus('unavailable'); return; }

      running = true;
      consecutiveErrors = 0;
      reportStatus('starting');

      var avail = plugin.available ? plugin.available() : Promise.resolve({ available: true });
      Promise.resolve(avail)
        .then(function (a) {
          if (!running) return;
          if (a && a.available === false) { reportStatus('unavailable'); running = false; return; }
          var perm = plugin.checkPermissions ? plugin.checkPermissions() : Promise.resolve({ speechRecognition: 'granted' });
          return Promise.resolve(perm).then(function (p) {
            var granted = p && (p.speechRecognition === 'granted' || p.speechRecognition === 'granted');
            if (granted) return true;
            if (!plugin.requestPermissions) return false;
            return Promise.resolve(plugin.requestPermissions()).then(function (p2) {
              return !!(p2 && p2.speechRecognition === 'granted');
            });
          });
        })
        .then(function (ok) {
          if (!running) return;
          if (!ok) { reportStatus('permission-denied'); running = false; return; }
          reportStatus('listening');
          runOneWindow();
        })
        .catch(function () {
          reportStatus('error');
          running = false;
        });
    }

    function stop() {
      if (!running) return;
      running = false;
      if (timeoutHandle) { clearTimeout(timeoutHandle); timeoutHandle = null; }
      var plugin = getPlugin();
      try { plugin && plugin.stop && plugin.stop(); } catch (e) {}
      reportStatus('stopped');
    }

    function isRunning() { return running; }

    return { start: start, stop: stop, isRunning: isRunning };
  }

  NS.recognizer.create = create;
  if (typeof module !== 'undefined' && module.exports) module.exports = { create: create };
})();

/*
 * ui.js
 * ------------------------------------------------------------------
 * Bootstrap script — the only part of this module that talks to the
 * DOM/recognizer directly. Concatenated after the pure runtime files
 * (fuzzyMatch, keywords, parsers, engine, recognizer) by build-patch.js,
 * so `window.RustlersVoice.*` is already populated when this runs.
 *
 * The suggestion card and the heard-transcript log are NOT rendered by
 * this script — they're real app state now (this.state.voiceLog /
 * this.state.voiceSuggestion, see build-patch.js's applyTemplatePatch),
 * so they render inline on the Play Entry tab and survive the app's own
 * re-renders. This script's job is narrower:
 *   - a small floating toggle (mic icon) that flips the feature flag in
 *     localStorage — the ONLY way this feature ever turns on. When off:
 *     no polling beyond the toggle button itself, no mic access, no
 *     recognizer.
 *   - a poll loop (every 1.2s) that reads the app's own persisted state
 *     to decide whether we're on a live game's Play Entry screen for a
 *     supported sport, and starts/stops the recognizer accordingly.
 *   - on each heard transcript, resolve it (see below) and push
 *     {transcript, suggestion} onto the hidden #__voice_bridge div and
 *     click it — voiceIngestFromBridge() in the template then appends
 *     to the log and, if nothing's already pending, sets the
 *     suggestion. Confirm/Dismiss are plain template-bound buttons now
 *     (onVoiceConfirm/onVoiceDismiss) — this script has no further
 *     part in applying a suggestion; that still goes through the same
 *     doAction/commitScore/teamStatTap a manual tap uses.
 *
 * Matching against a 2-chunk rolling buffer, not just the latest chunk
 * alone: Android's SpeechRecognizer captures one utterance per ~8s
 * window, so a real call like "Sutton spikes it down the line for the
 * kill" can easily land the player's name in one window and the event
 * word in the next. Matching each chunk alone means neither half ever
 * has both signals a parser needs — this was the likely cause of heard
 * audio never producing a single suggestion. Combining the last two
 * chunks before parsing fixes the common case without adding real
 * latency (a couple of seconds of lag is already an accepted tradeoff).
 *
 * Every entry point is wrapped so a failure anywhere in this file
 * degrades to "no suggestions" and never touches manual entry.
 */
(function () {
  try {
    var NS = window.RustlersVoice || {};
    var FLAG_KEY = 'rustlers_voice_enabled';
    var STATE_KEY = 'rustlers_v2';
    var POLL_MS = 1200;
    var SUGGESTION_TTL_MS = 15000; // matches the old floating card's auto-dismiss

    function flagOn() { try { return localStorage.getItem(FLAG_KEY) === '1'; } catch (e) { return false; } }
    function setFlag(on) { try { localStorage.setItem(FLAG_KEY, on ? '1' : '0'); } catch (e) {} }

    function readState() {
      try { return JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch (e) { return null; }
    }

    function E(t, c, x) {
      var e = document.createElement(t);
      if (c) e.style.cssText = c;
      if (x != null) e.textContent = x;
      return e;
    }

    // ---- floating toggle (the only floating UI this module has left) ------
    function ensureToggle() {
      if (document.getElementById('__voice_toggle')) return;
      var b = E('div',
        'position:fixed;right:10px;bottom:142px;z-index:2147483645;' +
        'background:rgba(28,122,54,.82);color:#fff;font:700 11px/1 -apple-system,Segoe UI,Roboto,sans-serif;' +
        'letter-spacing:1px;padding:8px 10px;border-radius:8px;cursor:pointer;',
        flagOn() ? '\u{1F3A4} VOICE: ON' : '\u{1F3A4} VOICE: OFF');
      b.id = '__voice_toggle';
      b.onclick = function () {
        var next = !flagOn();
        setFlag(next);
        b.textContent = next ? '\u{1F3A4} VOICE: ON' : '\u{1F3A4} VOICE: OFF';
        b.style.background = next ? 'rgba(28,122,54,.82)' : 'rgba(90,90,90,.7)';
        if (!next) teardown();
        // The inline panel's visibility is computed from this same flag at
        // app render time — force one immediate re-render (and clear any
        // stale suggestion while we're at it) so flipping the toggle shows/
        // hides it right away instead of waiting for the next transcript
        // (which may be seconds away, or never arrive at all).
        pushBridge('', null, true);
      };
      b.style.background = flagOn() ? 'rgba(28,122,54,.82)' : 'rgba(90,90,90,.7)';
      document.body.appendChild(b);
    }

    // ---- debug status line ---------------------------------------------
    // Read-only diagnostic, no write-path effect. Without this, "recognizer
    // errored out / permission denied / gave up" and "listening fine but
    // nothing cleared the confidence floor" are indistinguishable from the
    // sideline — the toggle only ever says ON/OFF and the log only shows
    // transcripts that got far enough to be pushed to the bridge.
    var debugState = { status: 'idle', transcript: '' };

    function ensureDebugLine() {
      var el = document.getElementById('__voice_debug');
      if (!flagOn()) { if (el && el.parentNode) el.parentNode.removeChild(el); return; }
      if (!el) {
        el = E('div',
          'position:fixed;right:10px;bottom:176px;z-index:2147483645;max-width:260px;' +
          'background:rgba(19,27,21,.85);border:1px solid rgba(42,58,48,.6);color:#9aa7b0;' +
          'font:600 10px/1.35 ui-monospace,monospace;letter-spacing:.2px;padding:6px 8px;' +
          'border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;', '');
        el.id = '__voice_debug';
        document.body.appendChild(el);
      }
      el.textContent = 'voice: ' + debugState.status +
        (debugState.transcript ? (' · heard: "' + debugState.transcript + '"') : '');
    }

    // ---- recognizer lifecycle, gated on state + flag -----------------------
    var recognizer = null;
    var lastCtxKey = null;
    var transcriptBuffer = []; // last 2 raw chunks, oldest first

    function pushBridge(transcript, suggestion, expire) {
      try {
        var bridge = document.getElementById('__voice_bridge');
        if (!bridge) return;
        bridge.setAttribute('data-json', JSON.stringify({ transcript: transcript, suggestion: suggestion, expire: !!expire }));
        bridge.click();
      } catch (e) {}
    }

    function ensureRecognizer() {
      if (recognizer) return recognizer;
      recognizer = NS.recognizer.create({
        onTranscript: function (text) {
          try {
            debugState.transcript = text;
            ensureDebugLine();
            transcriptBuffer.push(text);
            if (transcriptBuffer.length > 2) transcriptBuffer.shift();
            var combined = transcriptBuffer.join(' ');

            var state = readState();
            var ctx = NS.engine.buildContext(state);
            var suggestion = null;
            if (ctx) {
              var result = NS.engine.parseTranscript(ctx, combined);
              if (result) {
                transcriptBuffer.length = 0; // consumed — don't re-match the same words into the next suggestion
                suggestion = {
                  payload: NS.engine.toBridgePayload(result),
                  label: result.eventLabel || result.actKey || '',
                  playerLabel: result.playerRef ? NS.engine.playerLabel(ctx, result.playerRef) : '',
                  needsPlayer: !!result.needsPlayer,
                  candidates: result.needsPlayer ? NS.engine.rosterCandidates(ctx) : [],
                  ts: Date.now()
                };
              }
            }
            pushBridge(text, suggestion);
          } catch (e) {}
        },
        onStatus: function (s) {
          try { debugState.status = s; ensureDebugLine(); } catch (e) {}
        }
      });
      return recognizer;
    }

    function teardown() {
      if (recognizer) { try { recognizer.stop(); } catch (e) {} }
      transcriptBuffer.length = 0;
      ensureDebugLine();
    }

    function tick() {
      try {
        if (!flagOn()) { teardown(); return; }
        ensureDebugLine();
        var state = readState();

        // An ignored suggestion is real app state now (not a floating card
        // that auto-dismissed on its own timer) — without this it would sit
        // there forever and silently block every suggestion after it, since
        // the component only ever sets a new one when nothing's pending.
        if (state && state.voiceSuggestion && state.voiceSuggestion.ts &&
            (Date.now() - state.voiceSuggestion.ts > SUGGESTION_TTL_MS)) {
          pushBridge('', null, true);
        }

        var onPlayEntry = !!state && state.screen === 'game' && state.leftTab === 'play';
        var ctx = onPlayEntry ? NS.engine.buildContext(state) : null;
        var r = ensureRecognizer();
        if (ctx) {
          var key = ctx.sport + ':' + ctx.gameId;
          if (key !== lastCtxKey) { transcriptBuffer.length = 0; lastCtxKey = key; }
          if (!r.isRunning()) r.start();
        } else {
          lastCtxKey = null;
          if (r.isRunning()) r.stop();
          debugState.status = onPlayEntry ? debugState.status : 'not on play entry';
          ensureDebugLine();
        }
      } catch (e) {}
    }

    function boot() {
      ensureToggle();
      setInterval(function () { try { ensureToggle(); ensureDebugLine(); } catch (e) {} }, 2000);
      setInterval(tick, POLL_MS);
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  } catch (e) {
    // Never let this feature take the app down with it.
    try { console.warn('[voice-suggestions] disabled after init error', e); } catch (e2) {}
  }
})();

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e){ try{ console.error('[bundle]', (e&&(e.message||e.type))||'error', (e&&e.filename)||''); }catch(_){} }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
